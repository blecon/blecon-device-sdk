SB_CONFIG_BOOTLOADER_MCUBOOT=y

# The Partition Manager is deprecated and off by default since NCS 3.4. Keep it on
# so the `blecon` NVM partition (common/config/pm_static_<board>.yml) and the MCUboot
# layout stay exactly as on devices in the field.
SB_CONFIG_PARTITION_MANAGER=y
