manifest:
  group-filter: [-find-my, -babblesim, -nrf-802154, -dragoon, -libmodem, -bsec, -doc-internal]
  projects:
    - name: nrf
      revision: v3.4.1
      url: https://github.com/nrfconnect/sdk-nrf
      path: nrf
      import:
        name-blocklist:
          - matter
        path-prefix: west-ws
    - name: zephyr
      revision: ncs-v3.4.1
      url: https://github.com/nrfconnect/sdk-zephyr
      path: zephyr
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_nordic
          - hal_st
          - hal_stm32
          - nanopb
          - nrf_hw_models
          - picolibc
          - segger
          - tf-psa-crypto
          - zcbor
        path-prefix: west-ws

  self:
    path: blecon-device-sdk